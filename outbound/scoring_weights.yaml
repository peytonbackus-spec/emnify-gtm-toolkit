# Account prioritization weights. Every number is hypothesis: validate. They are starting points to be
# calibrated against emnify's won and lost accounts (see gtm_engineer/lead_scoring/calibrate_scoring.py for the method).
version: 1
fit:
  vertical_in_icp: 40          # equal for every vertical until win data ranks them
  size_bands:                  # employees -> points, first match wins
    - {min_employees: 500, points: 15}
    - {min_employees: 100, points: 12}
    - {min_employees: 20,  points: 8}
  size_default_points: 2
  region_points: {US: 10, Europe: 10, LATAM: 10, Philippines: 10}   # equal until win data ranks regions
signals:                       # points and half-life (days); decay = points * 0.5 ** (days_ago / half_life)
  new_connected_product_launch:   {points: 25, half_life_days: 45}
  hiring_embedded_or_iot_engineers: {points: 15, half_life_days: 30}
  funding_round:                  {points: 15, half_life_days: 60}
  expansion_into_new_countries:   {points: 20, half_life_days: 45}
  connectivity_provider_contract_window: {points: 20, half_life_days: 90}
potential:
  max_points: 20               # log-scaled on expected_device_count; unknown devices score 0 and are flagged
  device_count_for_max: 50000
tiers: {A: 70, B: 50, C: 30}   # score thresholds
